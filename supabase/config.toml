# Configuração do Supabase CLI (desenvolvimento local e deploy).
# Documentação: https://supabase.com/docs/guides/local-development/cli/config
project_id = "financas-casal"

[api]
enabled = true
port = 54321
schemas = ["public", "graphql_public"]

[db]
port = 54322
major_version = 15

[auth]
enabled = true
site_url = "financascasal://"
additional_redirect_urls = ["financascasal://*", "exp://*"]
jwt_expiry = 3600
enable_signup = true

[auth.email]
enable_signup = true
double_confirm_changes = true
# Login por código de 6 dígitos enviado por e-mail (sem senha).
enable_confirmations = false
otp_length = 6
otp_expiry = 3600

[storage]
enabled = true
file_size_limit = "20MiB"

[functions.parse-statement]
verify_jwt = true
